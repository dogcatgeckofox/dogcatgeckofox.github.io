---
layout: default
title: THE BLOG
---

<p>★ welcome to my blog ★</p>

<hr>
<p>
<button onclick="document.getElementById('music').play()">press if you DARE</button>
</p>

<audio id="music" loop>
    <source src="music/clairdelune.mp3" type="audio/mpeg">
</audio>

{% for post in site.posts %}

<div class="post">

<h2>
<a href="{{ post.url }}">{{ post.title }}</a>
</h2>

<p class="date">
{{ post.date | date: "%d / %m / %Y" }}
</p>

{{ post.excerpt }}

<p>
<a href="{{ post.url }}">READ MORE</a>
</p>

</div>

<hr>

{% endfor %}
<p>
<button onclick="document.getElementById('music').play()">press if you DARE</button>
</p>
<p>
<a href="index.html">BACK HOME</a>
</p>
